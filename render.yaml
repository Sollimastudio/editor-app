# Initial hosting cost approved by the owner in this conversation.
# Target workspace: My Workspace (tea-dahk75h594qs73fb5meg).
# Approved baseline: USD 25/month compute + USD 2.50/month for 10 GB disk.
# Usage overages, taxes and existing workspace fees, if any, are separate.
# Creating the Blueprint in the Render Dashboard is still required.
services:
  - type: web
    name: sol-video-factory
    runtime: docker
    branch: main
    plan: 1c-2g
    numInstances: 1
    region: virginia
    healthCheckPath: /health
    autoDeployTrigger: "off"
    disk:
      name: video-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: RENDER_THREADS
        value: "1"
      - key: MAX_STORAGE_MB
        value: "4000"
