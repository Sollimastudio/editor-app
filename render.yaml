# Provisioning this blueprint incurs hosting/storage fees. Confirm before applying.
services:
  - type: web
    name: sol-video-factory
    runtime: docker
    plan: standard
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: video-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: RENDER_THREADS
        value: "2"
      - key: MAX_STORAGE_MB
        value: "6500"
